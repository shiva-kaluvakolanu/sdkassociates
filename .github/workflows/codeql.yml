name: "CodeQL"

on:
  push: {branches: ["main"]}
  pull_request: {branches: ["main"]}
  schedule: [{cron: "0 6 * * 1"}]  # weekly

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: github/codeql-action/.github/workflows/codeql.yml@v3
    with:
      languages: javascript # add more: cpp,csharp,go,java,python,ruby,swift
